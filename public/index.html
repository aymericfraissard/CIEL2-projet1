<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion et inscription</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Mon espace</h1>
    </header>

    <main>
        <h2>Connexion</h2>
        <form id="connexionForm">
            <label for="loginUser">Identifiant</label>
            <input id="loginUser" name="login" type="text" minlength="4" maxlength="20" autocomplete="username" required>

            <label for="loginPass">Mot de passe</label>
            <input id="loginPass" name="password" type="password" autocomplete="current-password" required>

            <button id="btnConnexion" type="button">Se connecter</button>
            <p id="zoneMessage" aria-live="polite"></p>
        </form>

        <h2>Créer un compte</h2>
        <form id="inscriptionForm">
            <label for="registerprenom">prenom</label>
            <input id="registerprenom" name="prenom" type="text" minlength="3" maxlength="20" autocomplete="prenom" required>

            <label for="registernom">nom</label>
            <input id="registernom" name="nom" type="text" minlength="3" maxlength="20" autocomplete="nom" required>

            <label for="registerMail">mail</label>
            <input id="registerMail" name="mail" type="text" minlength="4" maxlength="35" autocomplete="mail" required>

            <label for="registerUser">Identifiant</label>
            <input id="registerUser" name="login" type="text" minlength="4" maxlength="20" autocomplete="username" required>

            <label for="registerPass">Mot de passe</label>
            <input id="registerPass" name="password" type="password" minlength="8" maxlength="30" autocomplete="new-password" required>



            <button id="btnInscription" type="button">S'inscrire</button>
            <p id="registerMsg" aria-live="polite"></p>
            <p id="zoneMessage1" aria-live="polite"></p>
        </form>
    </main>

    <script src="index.js"></script>
</body>
</html>
